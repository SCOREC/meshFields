name: self-hosted-gcc15-cuda13

on:
  pull_request:
    branches:
      - main
  # Manual trigger
  workflow_dispatch:

jobs:
  build_and_test_gcc15_cuda13:
    # The asics environment is only for launching on self-hosted runners.
    # Do not use or edit this environment for any other purpose.
    environment: asics
    permissions:
      contents: read
    # The type of runner that the job will run on
    runs-on: [self-hosted, linux, x64, gpu]

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          path: 'meshfields_${{ github.run_id }}' #under $GITHUB_WORKSPACE

      - name: build
        id: build
        shell: bash
        run: |
          set +e #avoid exiting when lua modules return non-zero on 'warning' messages
          source /etc/profile #provides module command
          module use /opt/scorec/spack/rhel9/v120dev0_2/lmod/linux-rhel9-x86_64/Core
          module load gcc/15.2.0-nzhmjja
          module load mpich/5.0.1-ytsgihl
          module load cuda/13.1.1-i4n7xnm
          module load cmake
          module load ninja
          set -e

          echo "github.workspace ${{github.workspace}}"

          date=`date +%F-%H-%M`
          workDir=${{github.workspace}}/meshfieldsCI_gcc15cuda13_${date}
          mkdir -p $workDir
          echo "MESHFIELDS_WORK_DIR=$(echo $workDir)" >> $GITHUB_ENV
          echo "workDir $workDir"

          # detect the gpu architecture, e.g., Kokkos_ARCH_AMPERE80
          arch=$(nvidia-smi -q | grep Architecture)
          cudaArch=$(echo ${arch^^} | awk '{print $4}')
          cudaCC=$(nvidia-smi --query-gpu=compute_cap --format=csv,noheader | tail -n1 | tr -d ".")
          echo "cudaArch $cudaArch cudaCC $cudaCC"

          # kokkos
          git clone --depth 1 --branch 5.1.1 https://github.com/Kokkos/kokkos.git ${workDir}/kokkos
          kkbdir=${workDir}/build-kokkos
          cmake -S ${workDir}/kokkos -B $kkbdir \
            -G Ninja \
            -DBUILD_SHARED_LIBS=on \
            -DCMAKE_CXX_COMPILER=g++ \
            -DKokkos_ARCH_${cudaArch}${cudaCC}=on \
            -DKokkos_ENABLE_SERIAL=ON \
            -DKokkos_ENABLE_OPENMP=off \
            -DKokkos_ENABLE_CUDA=on \
            -DKokkos_ENABLE_CUDA_LAMBDA=on \
            -DKokkos_ENABLE_DEBUG=off \
            -DKokkos_ENABLE_IMPL_VIEW_LEGACY=ON \
            -DCMAKE_INSTALL_PREFIX=$kkbdir/install
          cmake --build $kkbdir -j `nproc` --target install

          # omegah
          git clone https://github.com/SCOREC/omega_h.git ${workDir}/omegah
          ohbdir=${workDir}/build-omegah
          cmake -S ${workDir}/omegah -B $ohbdir \
            -G Ninja \
            -DCMAKE_CXX_SCAN_FOR_MODULES:BOOL=OFF \
            -DCMAKE_INSTALL_PREFIX=$ohbdir/install \
            -DBUILD_SHARED_LIBS=on \
            -DOmega_h_USE_Kokkos=on \
            -DKokkos_PREFIX=$kkbdir/install \
            -DOmega_h_USE_MPI=on \
            -DBUILD_TESTING=on \
            -DCMAKE_CXX_COMPILER=g++
          cmake --build $ohbdir -j `nproc` --target install

          # cabana
          git clone https://github.com/ECP-copa/Cabana.git ${workDir}/cabana
          cabbdir=${workDir}/build-cab
          cmake -S ${workDir}/cabana -B $cabbdir \
            -G Ninja \
            -DCMAKE_CXX_SCAN_FOR_MODULES:BOOL=OFF \
            -DCMAKE_CXX_COMPILER=${workDir}/kokkos/bin/nvcc_wrapper \
            -DKokkos_ROOT=$kkbdir/install \
            -DCabana_ENABLE_MPI=OFF \
            -DCabana_ENABLE_CAJITA=OFF \
            -DCabana_ENABLE_TESTING=OFF \
            -DCabana_ENABLE_EXAMPLES=OFF \
            -DCabana_ENABLE_Cuda=ON \
            -DCMAKE_INSTALL_PREFIX=$cabbdir/install
          cmake --build $cabbdir -j `nproc` --target install

          # meshfields, with and without cabana
          for cab in on off; do
            mfbdir=${workDir}/build-meshfields_cab${cab}
            cmake -S meshfields_${{ github.run_id }} -B $mfbdir \
              -G Ninja \
              -DCMAKE_CXX_SCAN_FOR_MODULES:BOOL=OFF \
              -DMeshFields_USE_Cabana=$cab \
              -DOmega_h_ROOT=$ohbdir/install \
              -DKokkos_ROOT=$kkbdir/install \
              -DCabana_ROOT=$cabbdir/install \
              -DMeshFields_USE_EXCEPTIONS=OFF \
              -DMeshFields_IS_TESTING=ON
            cmake --build $mfbdir -j `nproc`
            ctest --test-dir $mfbdir --output-on-failure
          done

      - name: Cleanup
        if: ${{ !cancelled() }}
        run: |
          echo "MESHFIELDS_WORK_DIR $MESHFIELDS_WORK_DIR"
          rm -rf $MESHFIELDS_WORK_DIR
